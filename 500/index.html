<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>500 — Server Error | The Fade Room</title>
<meta name="description" content="The Fade Room — something went wrong on our server. We're working on it.">
<script src="/assets/site-preferences.js"></script>
<link rel="stylesheet" href="/assets/fonts.css">
<style>
/* ===========================================================
   DESIGN SYSTEM — heredado de The Fade Room (barbershop_web)
   Paleta crema/dorado premium + modo oscuro
   =========================================================== */
:root{
  --black:#0D0B08;--gold:#C9A24B;--gold-light:#E3C077;--gold-bright:#E3C077;
  --gold-pale:#2A2013;--gold-dim:#7A5636;--copper:#B8863C;
  --cream:#0D0B08;--cream-2:#161209;--text-main:#F1E6CE;
  --text-sub:rgba(241,230,206,0.72);--text-muted:rgba(241,230,206,0.45);
  --surface:#1B160E;--surface-2:#161209;
  --border:rgba(201,162,75,0.16);--border-strong:rgba(201,162,75,0.4);
  --radius:12px;--radius-lg:20px;
  --shadow:0 4px 24px rgba(201,162,75,0.08),0 1px 4px rgba(0,0,0,0.06);
  --danger:#B24B3C;
}
:root[data-theme="light"]{
  --black:#FAF7F0;--gold:#A9762E;--gold-light:#C79646;--gold-bright:#C79646;
  --gold-pale:#F1E4C8;--gold-dim:#8A6A3E;--copper:#7C5620;
  --cream:#FAF7F0;--cream-2:#F1E9D6;--text-main:#221A0F;
  --text-sub:rgba(34,26,15,0.72);--text-muted:rgba(34,26,15,0.45);
  --surface:#FFFFFF;--surface-2:#F1E9D6;
  --border:rgba(169,118,46,0.22);--border-strong:rgba(169,118,46,0.48);
  --shadow:0 4px 24px rgba(169,118,46,0.08),0 1px 4px rgba(0,0,0,0.06);
  --danger:#B24B3C;
  --danger:#D97B65;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--cream);color:var(--text-main);
  min-height:100%;overflow-x:hidden;
  transition:background .3s,color .3s;
  line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none;}

/* ===========================================================
   NAVBAR + TOP CONTROLS (idénticos a referencia)
   =========================================================== */
.navbar{
  position:sticky;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
  background:color-mix(in srgb, var(--cream) 85%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  transition:background .3s,border-color .3s;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;
  color:var(--text-main);letter-spacing:.3px;
}
.brand-logo{width:34px;height:34px;object-fit:contain}
.brand-logo.logo-dark{display:none}
:root[data-theme="light"] .brand-logo.logo-light{display:none}
:root[data-theme="light"] .brand-logo.logo-dark{display:block}
.brand svg{width:26px;height:26px;flex-shrink:0;}
.brand em{color:var(--gold);font-style:italic;font-weight:400;}
.top-controls{display:flex;gap:8px;pointer-events:auto;}
.top-btn{
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:50px;padding:8px 16px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:500;
  color:var(--gold);cursor:pointer;
  display:flex;align-items:center;gap:7px;
  transition:all .2s;box-shadow:var(--shadow);letter-spacing:.5px;
}
.top-btn:hover{background:var(--gold-pale);}

/* ===========================================================
   500 HERO
   =========================================================== */
.error-hero{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:60px 24px;max-width:1280px;margin:0 auto;width:100%;
}
.error-content{text-align:center;max-width:560px;}
.studio-tag{
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:var(--gold);font-weight:500;margin-bottom:18px;display:inline-block;
}
.error-code{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(88px, 22vw, 160px);font-weight:300;line-height:1;
  color:var(--text-main);letter-spacing:-2px;margin-bottom:6px;
}
.error-code em{font-style:italic;color:var(--gold);}
.error-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(26px, 5vw, 36px);font-weight:400;
  color:var(--text-main);margin-bottom:16px;letter-spacing:-.3px;
}
.error-title em{font-style:italic;color:var(--gold);}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 26px;max-width:180px;}
.divider-line{flex:1;height:1px;background:var(--border-strong);}
.divider-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}
.error-sub{
  font-size:15px;color:var(--text-sub);max-width:440px;margin:0 auto 30px;
  line-height:1.75;font-weight:300;
}
.error-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}

.error-logo{
  position:relative;display:block;width:72px;height:72px;margin:0 auto 22px;
}
.error-logo img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
}
.error-logo .logo-dark{display:none}
:root[data-theme="light"] .error-logo .logo-light{display:none}
:root[data-theme="light"] .error-logo .logo-dark{display:block}

/* Status pill */
.status-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:50px;
  background:var(--surface);border:1.5px solid var(--border);
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-sub);font-weight:500;box-shadow:var(--shadow);
}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--danger);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:.4;}
}

/* ===========================================================
   BUTTONS (estilos heredados)
   =========================================================== */
.btn-primary, .btn-secondary{
  padding:15px 30px;border-radius:50px;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:all .25s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid transparent;
}
.btn-primary{background:var(--gold);color:var(--black);border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,168,76,.35);}
.btn-secondary{background:transparent;color:var(--gold);border-color:var(--gold);}
.btn-secondary:hover{background:var(--gold);color:var(--black);transform:translateY(-2px);}

/* ===========================================================
   FOOTER
   =========================================================== */
.footer{
  text-align:center;padding:32px 24px calc(28px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
}
.footer-brand{
  font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);
  font-style:italic;margin-bottom:6px;
}
.footer-copy{font-size:11px;color:var(--text-muted);letter-spacing:1px;}
.footer-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0;}
.footer-links a{font-size:12px;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px;}

@media(min-width:768px){
  .error-hero{padding:80px 32px;}
}
</style>
</head>
<body>

<!-- ============== NAVBAR ============== -->
<nav class="navbar">
  <a href="/" class="brand" aria-label="The Fade Room" id="brand-link">
    <img src="/assets/logo-light.png" alt="" class="brand-logo logo-light" width="34" height="34">
    <img src="/assets/logo-dark.png" alt="" class="brand-logo logo-dark" width="34" height="34">
    <span>The Fade <em>Room</em></span>
  </a>
  <div class="top-controls">
    <button class="top-btn" onclick="toggleLang()" id="lang-btn" aria-label="Change language">
      <svg viewBox="0 0 16 16" fill="none" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5C8 1.5 6 4 6 8C6 12 8 14.5 8 14.5M8 1.5C8 1.5 10 4 10 8C10 12 8 14.5 8 14.5M1.5 8H14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span id="lang-label">ES</span>
    </button>
    <button class="top-btn" onclick="toggleTheme()" id="theme-btn" aria-label="Toggle dark mode">
      <span id="theme-icon">☀</span>
      <span id="theme-label">Light</span>
    </button>
  </div>
</nav>

<!-- ============== 500 HERO ============== -->
<section class="error-hero">
  <div class="error-content">
    <span class="studio-tag" id="studio-tag">The Fade Room</span>

    <div class="error-logo" role="img" aria-label="The Fade Room logo">
      <img src="/assets/logo-light.png" alt="" class="logo-light" width="72" height="72">
      <img src="/assets/logo-dark.png" alt="" class="logo-dark" width="72" height="72">
    </div>

    <h1 class="error-code">5<em>0</em>0</h1>
    <h2 class="error-title" id="error-title">We slipped with the <em>razor</em></h2>
    <div class="divider"><div class="divider-line"></div><div class="divider-dot"></div><div class="divider-line"></div></div>
    <p class="error-sub" id="error-sub">Something broke on our end, not yours. Our team's already been notified and is sharpening a fix.</p>

    <div class="error-ctas">
      <button type="button" class="btn-primary" id="cta-retry" onclick="window.location.reload()">Try Again</button>
      <a href="/" class="btn-secondary" id="cta-home">Back to Home</a>
    </div>

    <div class="status-pill">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-label">Server error</span>
    </div>
  </div>
</section>

<!-- ============== FOOTER ============== -->
<footer class="footer">
  <div class="footer-brand">The Fade Room</div>
  <nav class="footer-links" id="footer-links" aria-label="Legal navigation">
    <a href="/privacy/" id="privacy-link">Privacy Policy</a>
    <a href="/terms/" id="terms-link">Terms of Service</a>
    <a href="/terms/#accessibility" id="accessibility-link">Accessibility</a>
  </nav>
  <div class="footer-copy" id="footer-copy">© 2026 — Fine Barbering. All rights reserved.</div>
</footer>

<script>
/* ===========================================================
   TRADUCCIONES (mismo patrón que el archivo de referencia)
   =========================================================== */
const T = {
  en: {
    'document-title':'500 — Server Error | The Fade Room',
    'meta-description':'The Fade Room — the server could not complete this request.',
    'studio-tag':'The Fade Room',
    'error-title':'We slipped with the <em>razor</em>',
    'error-sub':"Something went wrong while processing this request. Please try again later.",
    'cta-retry':'Try Again',
    'cta-home':'Back to Home',
    'status-label':'Server error',
    'lang-label':'EN',
    'theme-label':'Dark',
    'theme-label-dark':'Light',
    'footer-copy':'© 2026 — Fine Barbering. All rights reserved.',
    'privacy-link':'Privacy Policy','terms-link':'Terms of Service','accessibility-link':'Accessibility',
    'footer-navigation':'Legal navigation','language-aria':'Change language','theme-aria':'Toggle light or dark theme'
  },
  es: {
    'document-title':'500 — Error del servidor | The Fade Room',
    'meta-description':'The Fade Room — el servidor no pudo completar esta solicitud.',
    'studio-tag':'The Fade Room',
    'error-title':'Se nos resbaló la <em>navaja</em>',
    'error-sub':'Ocurrió un error al procesar esta solicitud. Inténtalo de nuevo más tarde.',
    'cta-retry':'Reintentar',
    'cta-home':'Volver al inicio',
    'status-label':'Error del servidor',
    'lang-label':'ES',
    'theme-label':'Oscuro',
    'theme-label-dark':'Claro',
    'footer-copy':'© 2026 — Fine Barbering. Todos los derechos reservados.',
    'privacy-link':'Política de privacidad','terms-link':'Términos del servicio','accessibility-link':'Accesibilidad',
    'footer-navigation':'Navegación legal','language-aria':'Cambiar idioma','theme-aria':'Cambiar entre tema claro y oscuro'
  }
};

let isES = SitePreferences.getLanguage() === 'es';
let isDark = SitePreferences.getTheme() === 'dark';

function t(key){ return (isES ? T.es : T.en)[key] || key; }

function applyLang(){
  document.title = t('document-title');
  document.querySelector('meta[name="description"]').content = t('meta-description');
  const ids = ['error-title','error-sub','cta-retry','cta-home','status-label','footer-copy'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const val = t(id);
    if(/<[a-z]/i.test(val)) el.innerHTML = val; else el.textContent = val;
  });
  document.getElementById('studio-tag').textContent = t('studio-tag');
  document.getElementById('lang-label').textContent = t('lang-label');
  document.getElementById('theme-label').textContent = isDark ? t('theme-label-dark') : t('theme-label');
  document.getElementById('theme-icon').textContent = isDark ? '☀' : '☽';
  ['privacy-link','terms-link','accessibility-link'].forEach(id => {
    document.getElementById(id).textContent = t(id);
  });
  document.getElementById('footer-links').setAttribute('aria-label', t('footer-navigation'));
  document.getElementById('lang-btn').setAttribute('aria-label', t('language-aria'));
  document.getElementById('theme-btn').setAttribute('aria-label', t('theme-aria'));
  document.documentElement.lang = isES ? 'es' : 'en';
}

function toggleLang(){
  isES = SitePreferences.getLanguage() !== 'es';
  SitePreferences.setLanguage(isES ? 'es' : 'en');
  applyLang();
}

function toggleTheme(){
  isDark = SitePreferences.getTheme() !== 'dark';
  SitePreferences.setTheme(isDark ? 'dark' : 'light');
  applyLang();
}

window.addEventListener('sitepreferenceschange', event => {
  isES = event.detail.language === 'es';
  isDark = event.detail.theme === 'dark';
  applyLang();
});
applyLang();
</script>
</body>
</html>
